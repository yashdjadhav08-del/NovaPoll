name: NovaPoll CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-contracts:
    name: Soroban Smart Contracts CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace -- -D warnings

      - name: Run Contract Unit & Integration Tests
        run: cargo test --target-dir target_ci

      - name: Build Soroban WASM Binaries
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Upload Contract WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm-contracts
          path: target/wasm32-unknown-unknown/release/*.wasm

  test-and-build-frontend:
    name: Frontend React & Web3 CI/CD
    runs-on: ubuntu-latest
    needs: test-contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build React Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Deploy to Production (Vercel)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "Production deployment triggered on Vercel"
